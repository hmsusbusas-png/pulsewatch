[project]
name = "pulsewatch-backend"
version = "1.0.0"
description = "Uptime monitoring API for pulsewatch"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162,<0.170",
    "uvicorn[standard]>=0.54,<0.60",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "asyncpg>=0.32,<0.33",
    "alembic>=1.20,<2.0",
    "apscheduler>=3.11,<4.0",
    "httpx>=0.28,<0.29",
    "pydantic>=2.14,<3.0",
    "pydantic-settings>=2.16,<3.0",
    "passlib[bcrypt]>=1.7.4,<2.0",
    "bcrypt==4.0.1",
    "python-jose[cryptography]>=3.5,<4.0",
    "email-validator>=2.2,<3.0",
    "greenlet>=3.5,<4.0",
    "certifi>=2024.8.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2,<10.0",
    "pytest-asyncio>=1.4,<2.0",
    "ruff>=0.17,<0.18",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "C4", "SIM", "RET", "PTH", "DTZ", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S104"]
"alembic/versions/*" = ["E501"]
"app/config.py" = ["S105"]
"app/schemas.py" = ["S105"]
"scripts/*" = ["S105", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = false
exclude = "alembic/versions"

[[tool.mypy.overrides]]
module = ["passlib.*", "jose.*", "apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]